# OxiMux fork addition, not part of upstream serve-sim.
#
# Builds, tests and (on a `helper-v*` tag) releases oximux-sim-helper, the
# stdio-only simulator helper bundled by the OxiMux desktop app. See
# oximux/README.md. OxiMux pins each release by version + sha256, so a
# published asset must never be replaced; cut a new version instead.
name: oximux-helper

on:
  push:
    branches: [oximux]
    tags: ["helper-v*"]
  pull_request:
    branches: [oximux]
  workflow_dispatch: {}

concurrency:
  group: oximux-helper-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Same runner image family as upstream's native CI. Pinned by major
  # version; the exact Xcode used is printed in the build log.
  XCODE_MAJOR: "26"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the patch-scope check diffs against the upstream base.
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_MAJOR }}.x
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_"${XCODE_MAJOR}"*.app)
          if (( ${#candidates[@]} == 0 )); then
            echo "::error::no Xcode ${XCODE_MAJOR}.x on this runner"; printf '%s\n' /Applications/Xcode*.app; exit 1
          fi
          xcode=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Patch scope (exactly the upstream files listed in oximux/PATCHES.md)
        run: |
          base=$(cat oximux/upstream-base)
          # Everything that differs from the upstream base, minus our purely
          # additive files. What remains must be exactly the PATCHES.md list:
          # an unlisted change is an undocumented patch, and a listed file that
          # no longer differs is a stale row (e.g. upstream merged the fix).
          changed=$(git diff --name-only "$base" HEAD \
            | grep -v -E '^(Package\.swift|oximux/|\.github/workflows/oximux-helper\.yml)' \
            | sort -u || true)
          listed=$(grep -E '^\| [0-9]+ \|' oximux/PATCHES.md | grep -o 'packages/[^`]*' | sort -u)
          if [[ "$changed" != "$listed" ]]; then
            echo "::error::upstream changes and oximux/PATCHES.md disagree"
            diff <(printf '%s\n' "$listed") <(printf '%s\n' "$changed") || true
            exit 1
          fi
          echo "patched upstream files:"; printf '%s\n' "$changed"

      - name: Test
        run: swift test

      - name: Build (release, arm64)
        run: swift build -c release --arch arm64

      - name: Smoke checks
        run: |
          bin=.build/arm64-apple-macosx/release/oximux-sim-helper
          "$bin" --version
          # System Swift runtime only (macOS 14+): nothing to bundle.
          if otool -L "$bin" | grep -q '@rpath/libswift'; then
            echo "::error::helper links an @rpath Swift runtime"; otool -L "$bin"; exit 1
          fi
          # No entitlements (in particular no get-task-allow).
          ents=$(codesign -d --entitlements - "$bin" 2>/dev/null || true)
          if [[ -n "$ents" ]]; then
            echo "::error::helper carries entitlements"; echo "$ents"; exit 1
          fi
          [[ "$(lipo -archs "$bin")" == "arm64" ]]
          # Conformance mode needs no simulator: the first event must be a
          # protocol-2 hello, and a command must echo back parsed.
          python3 - "$bin" <<'PY'
          import json, struct, subprocess, sys
          p = subprocess.Popen([sys.argv[1], "--conformance"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          body = json.dumps({"cmd": "ping", "id": 1}).encode()
          out, _ = p.communicate(struct.pack("<I", len(body)) + body, timeout=30)
          msgs, i = [], 0
          while i < len(out):
              n = struct.unpack("<I", out[i + 1:i + 5])[0]
              msgs.append((out[i], out[i + 5:i + 5 + n])); i += 5 + n
          hello = json.loads(msgs[0][1])
          assert msgs[0][0] == 2 and hello["event"] == "hello" and hello["proto"] == 2, hello
          last = json.loads(msgs[-1][1])
          assert last == {"event": "parsed", "command": {"cmd": "ping"}, "id": 1}, last
          assert p.returncode == 0
          print(f"conformance ok: {len(msgs)} messages")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oximux-sim-helper-arm64
          path: .build/arm64-apple-macosx/release/oximux-sim-helper
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/helper-v')
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must be on the oximux branch
        run: |
          git fetch --no-tags origin oximux
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on branch oximux; refusing to release"; exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oximux-sim-helper-arm64
          path: dist-bin

      - name: Package
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#helper-v}"
          declared=$(sed -n 's/^let helperVersion = "\(.*\)"$/\1/p' oximux/Sources/oximux-sim-helper/Version.swift)
          if [[ "$version" != "$declared" ]]; then
            echo "::error::tag $tag disagrees with helperVersion $declared"; exit 1
          fi
          name="oximux-sim-helper-${version}-macos-arm64"
          mkdir -p "$name"
          install -m 0755 dist-bin/oximux-sim-helper "$name/oximux-sim-helper"
          [[ "$("$name/oximux-sim-helper" --version)" == "oximux-sim-helper $version" ]]
          cp LICENSE oximux/PATCHES.md oximux/README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.pkg.outputs.name }}.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # 0.x releases are pre-releases until the protocol settles.
          pre=()
          [[ "$VERSION" == 0.* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$NAME.tar.gz" "$NAME.tar.gz.sha256" \
            "${pre[@]}" --verify-tag \
            --title "oximux-sim-helper $VERSION" \
            --notes "Built from \`$(git rev-parse --short HEAD)\` on upstream base \`$(cut -c1-12 oximux/upstream-base)\`. arm64, hardened-runtime-ready, no entitlements, stdio only. See oximux/README.md and oximux/PATCHES.md."
